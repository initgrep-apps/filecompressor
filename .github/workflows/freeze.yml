name: Freeze mac sidecars

on:
  workflow_dispatch:

concurrency:
  group: freeze-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: tag-collision gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: report same-day sidecars release collision with remediation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |-
          set -euo pipefail
          tag="sidecars-$(date -u +%Y%m%d)"
          rc=0
          err="$(gh release view "$tag" 2>&1 >/dev/null)" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::release $tag already exists — recovery: delete any leftover draft release, run 'gh release delete $tag --cleanup-tag --yes', then re-run the failed freeze jobs"
            exit 1
          fi
          if ! echo "$err" | grep -qiE 'not found|no release'; then
            echo "::error::collision preflight could not verify tag absence (auth/scopes/rate limit/network): $err"
            exit 1
          fi
          echo "gate passed — no same-day sidecars release"
        shell: bash

  freeze:
    name: freeze (${{ matrix.triple }})
    needs: [gate]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-15
          - triple: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: setup-node (v4)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: yarn
      - name: install dependencies
        run: yarn install --frozen-lockfile
        shell: bash
      - name: rust toolchain (dtolnay/rust-toolchain stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: stage sidecar engines (${{ matrix.triple }})
        run: node scripts/binaries/all.mjs --target ${{ matrix.triple }}
        shell: bash
      - name: freeze bundle (${{ matrix.triple }})
        run: bash scripts/ci/freeze.sh --triple ${{ matrix.triple }}
        shell: bash
      - name: upload bundle (v4)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sidecar-bundle-${{ matrix.triple }}
          path: |
            src-tauri/.freeze/sidecar-bundle-${{ matrix.triple }}.tar.gz
            src-tauri/.freeze/sidecar-bundle-${{ matrix.triple }}.tar.gz.sha256
          if-no-files-found: error

  finalize:
    name: publish sidecars release
    needs: [freeze]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download bundles (v4)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sidecar-bundle-*
          merge-multiple: true
          path: release-assets
      - name: preflight — require exactly 4 bundle assets
        run: |-
          set -euo pipefail
          if [ ! -d release-assets ]; then
            echo "::error::release-assets directory missing — download-artifact step produced nothing"
            exit 1
          fi
          count="$(find release-assets -type f | wc -l | tr -d ' ')"
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 bundle assets (2 tarballs + 2 .sha256), found $count"
            exit 1
          fi
        shell: bash
      - name: publish sidecars release (draft → upload → verify → publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |-
          set -euo pipefail
          tag="sidecars-$(date -u +%Y%m%d)"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag"
          gh release upload "$tag" release-assets/* --clobber
          n="$(gh release view "$tag" --json assets --jq 'length')"
          if [ "$n" -ne 4 ]; then
            echo "::error::$tag has $n/4 assets — draft left in place, not published; recovery: 'gh release delete $tag --cleanup-tag --yes' to discard the draft, then re-run finalize"
            exit 1
          fi
          gh release edit "$tag" --draft=false
        shell: bash
