name: PR gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.triple }})
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-15
          - triple: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: setup-node (v4)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: yarn
      - name: install dependencies
        run: yarn install --frozen-lockfile
        shell: bash
      - name: rust toolchain (dtolnay/rust-toolchain stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: rust cache (Swatinem/rust-cache v2.9.2)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.os }}
          workspaces: src-tauri
      - name: restore frozen engines (${{ matrix.triple }})
        env:
          TRIPLE: ${{ matrix.triple }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci/unfreeze.sh --triple "$TRIPLE"
        shell: bash
      - name: derive macOS frameworks list from the restored tree (${{ matrix.triple }})
        if: runner.os == 'macOS'
        env:
          TRIPLE: ${{ matrix.triple }}
        run: node scripts/binaries/sync-macos-frameworks.mjs --target "$TRIPLE"
        shell: bash
      - name: clean-room audit of restored engines (macos)
        if: runner.os == 'macOS'
        env:
          BINARIES_ALLOW_INACTIVE_BREW: "1"
        run: yarn binaries:audit
        shell: bash
      - name: clean-room audit of restored engines (windows)
        if: runner.os == 'Windows'
        run: yarn binaries:audit
        shell: bash
      - name: cargo test build (windows loader diagnostics)
        if: runner.os == 'Windows'
        run: cd src-tauri && cargo test --no-run
        shell: bash
      - name: loader diagnostics (windows)
        if: runner.os == 'Windows'
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          cd src-tauri
          EXE="$(ls -t target/debug/deps/file_compressor_lib-*.exe | head -1)"
          echo "newest lib-test exe: $EXE"
          echo "node: $(node --version)"
          echo "rustc: $(rustc --version)"
          echo "rust-cache key (matrix part): $TRIPLE (auto part comes from the rust-cache step log)"
          LOADER_DLLS="$(find target -iname 'WebView2Loader.dll' 2>/dev/null || true)"
          if [ -n "$LOADER_DLLS" ]; then
            echo "WebView2Loader.dll under target:"
            echo "$LOADER_DLLS"
          else
            echo "WebView2Loader.dll under target: none"
          fi
          if ! node ../scripts/binaries/pe-imports-diag.mjs "$EXE"; then
            echo "node PE parser failed — dumpbin fallback"
            DUMPBIN="$(find "/c/Program Files/Microsoft Visual Studio" "/c/Program Files (x86)/Microsoft Visual Studio" -name dumpbin.exe 2>/dev/null | head -1)"
            if [ -n "$DUMPBIN" ]; then
              MSYS_NO_PATHCONV=1 "$DUMPBIN" /DEPENDENTS "$EXE"
            else
              echo "dumpbin.exe not found on the runner"
            fi
          fi
        shell: bash
      - name: loader probe (windows)
        if: runner.os == 'Windows'
        run: |
          cd src-tauri
          if cargo test --lib -- --nocapture; then
            echo "lib-test harness launched — loader accepted the exe"
          else
            echo "lib-test harness died before running tests — loader failure confirmed pre-main"
          fi
        shell: bash
      - name: gate (build + tests + cargo tests)
        run: yarn build && yarn test && cd src-tauri && cargo test
        shell: bash
